# Pages CMS config: defines the entry forms at app.pagescms.org
# Shared field definitions (YAML anchors) to reduce duplication

# Reusable field anchors
_body_field: &body
  name: body
  label: Text (Markdown)
  type: text

_title_field: &title
  name: title
  label: Name
  type: string
  required: true

_title_only: &title_str
  name: title
  type: string

_legacy_aliases: &legacy_aliases
  name: aliases
  label: Legacy URL redirects
  type: string
  list: true

_summary_field: &summary
  name: summary
  label: One-line summary
  type: string

_image_field: &image
  name: image
  label: Picture (optional)
  type: image

_tags_field: &tags
  name: tags
  label: Tags
  type: string
  list: true

# Shared option lists
_entry_types: &entry_types
  values:
    - Character
    - Place
    - Faction
    - Lore
    - Session
    - Item
    - Rules
    - Other

_ability_scores: &abilities
  values:
    - STR
    - DEX
    - CON
    - INT
    - WIS
    - CHA

# UNIFIED source options (Phase 1 fix: all sections now use same list)
_sources_all: &sources_all
  values:
    - SRD 5.1
    - Homebrew
    - Corpus Angelus
    - Alternate Fighter
    - Alternate Monk
    - Alternate Monk Expanded
    - Erevan's Guide to Death & Beyond
    - Tasha's Cauldron of Everything
    - User-provided Tamer class
    - Appendix B — Spells
    - Campaign Archive house rule

# Status field (Phase 1 fix: mark incomplete entries for filtering)
_incomplete_field: &incomplete
  name: incomplete
  label: Incomplete/Stub (hidden from new players)
  type: boolean

_content_status_field: &content_status
  name: content_status
  label: Content status
  type: select
  options:
    values:
      - complete
      - incomplete
      - draft

_incomplete_reason_field: &incomplete_reason
  name: incomplete_reason
  label: Reason incomplete
  type: string

_source_type_field: &source_type
  name: source_type
  label: Source type
  type: select
  required: true
  options:
    values:
      - SRD
      - homebrew
      - third-party
      - official-supplement
      - campaign-original

_entity_type_field: &entity_type
  name: entity_type
  label: Entity type (keep unchanged)
  type: string

_canonical_id_field: &canonical_id
  name: canonical_id
  label: Canonical ID (keep unchanged)
  type: string

_edition_field: &edition
  name: edition
  label: Rules edition
  type: select
  options:
    values: ["2014", "2024", system-neutral]

_adaptation_field: &adaptation
  name: adaptation
  label: Adaptation type
  type: select
  options:
    values: [verbatim, summarized, curated, adapted, original]

_license_status_field: &license_status
  name: license_status
  label: License status (keep unchanged)
  type: select
  options:
    values: [CC-BY-4.0, reference-only, original]

# Campaign tracking (Phase 1 fix: which campaigns use this)
_appeared_in_field: &appeared_in
  name: appeared_in
  label: Appears in (campaigns/sessions)
  type: string
  list: true

media:
  input: content/media
  output: /campaign-archive/media

content:
  # Campaigns
  - name: campaigns
    label: Campaigns
    type: group
    items:
      - name: campaigns-index
        label: Campaign directory
        type: file
        path: content/campaigns/index.md
        fields:
          - *title_str
          - *body

      - name: ra-golvek
        label: Ra Gol'vek
        type: group
        items:
          - name: ra-golvek-entries
            label: Entries
            type: collection
            path: content/campaigns/ra-golvek
            exclude:
              - index.md
            filename: "{primary}.md"
            view:
              primary: title
              fields:
                - type
                - summary
              sort: title
            fields:
              - *entity_type
              - *canonical_id
              - *edition
              - *adaptation
              - *license_status
              - *title
              - name: type
                label: Type
                type: select
                options: *entry_types
              - *summary
              - *tags
              - *image
              - *content_status
              - *incomplete_reason
              - *source_type
              - *incomplete
              - *body
          - name: ra-golvek-hub
            label: Hub page
            type: file
            path: content/campaigns/ra-golvek/index.md
            fields:
              - *title_str
              - *legacy_aliases
              - *body

      - name: vyrun
        label: Vyrun
        type: group
        items:
          - name: vyrun-entries
            label: Entries
            type: collection
            path: content/campaigns/vyrun
            exclude:
              - index.md
            filename: "{primary}.md"
            view:
              primary: title
              fields:
                - type
                - summary
              sort: title
            fields:
              - *entity_type
              - *canonical_id
              - *edition
              - *adaptation
              - *license_status
              - *title
              - name: type
                label: Type
                type: select
                options: *entry_types
              - *summary
              - *tags
              - *image
              - *content_status
              - *incomplete_reason
              - *source_type
              - *incomplete
              - *body
          - name: vyrun-hub
            label: Hub page
            type: file
            path: content/campaigns/vyrun/index.md
            fields:
              - *title_str
              - *legacy_aliases
              - *body

      - name: curse-of-strahd
        label: Curse of Strahd
        type: group
        items:
          - name: curse-of-strahd-entries
            label: Entries
            type: collection
            path: content/campaigns/curse-of-strahd
            exclude:
              - index.md
            filename: "{primary}.md"
            view:
              primary: title
              fields:
                - type
                - summary
              sort: title
            fields:
              - *entity_type
              - *canonical_id
              - *edition
              - *adaptation
              - *license_status
              - *title
              - name: type
                label: Type
                type: select
                options: *entry_types
              - *summary
              - *tags
              - *image
              - *content_status
              - *incomplete_reason
              - *source_type
              - *incomplete
              - *body
          - name: curse-of-strahd-hub
            label: Hub page
            type: file
            path: content/campaigns/curse-of-strahd/index.md
            fields:
              - *title_str
              - *legacy_aliases
              - *body

  # Global rules
  - name: rules
    label: Rules
    type: collection
    path: content/rules
    exclude:
      - index.md
    filename: "{primary}.md"
    fields:
      - *entity_type
      - *canonical_id
      - *edition
      - *adaptation
      - *license_status
      - *title
      - name: source
        label: Source
        type: string
      - *summary
      - *content_status
      - *incomplete_reason
      - *source_type
      - *incomplete
      - *body

  # Spells (SRD + Homebrew)
  - name: spells
    label: Spells
    type: collection
    path: content/spells
    exclude:
      - index.md
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - level
        - school
        - classes
        - source
      sort: title
    fields:
      - *entity_type
      - *canonical_id
      - *edition
      - *adaptation
      - *license_status
      - name: title
        label: Spell name
        type: string
        required: true
      - name: level
        label: Level (0 for cantrip)
        type: number
        required: true
      - name: school
        label: School
        type: select
        options:
          values:
            - Abjuration
            - Conjuration
            - Divination
            - Enchantment
            - Evocation
            - Illusion
            - Necromancy
            - Transmutation
            - Biomancy
      - name: classes
        label: Classes
        type: select
        options:
          multiple: true
          values:
            - Artificer
            - Bard
            - Cleric
            - Druid
            - Paladin
            - Paragon
            - Ranger
            - Sorcerer
            - Thanatomancer
            - Tamer
            - Warlock
            - Wizard
      - name: casting_time
        label: Casting time
        type: string
      - name: range
        label: Range
        type: string
      - name: duration
        label: Duration
        type: string
      - name: components
        label: Components (V, S, M)
        type: string
      - name: ritual
        label: Ritual
        type: boolean
      - name: concentration
        label: Concentration
        type: boolean
      - name: subclass_spell_lists
        label: Subclass spell lists
        type: string
        list: true
      - name: spell_name
        label: Legacy spell name
        type: string
      - name: alternate_school
        label: Alternate school
        type: string
      - name: arcane_knight_list_marker
        label: Arcane Knight list marker
        type: string
      - name: mystic_list_marker
        label: Mystic list marker
        type: string
      - name: witchblade_list_marker
        label: Witchblade list marker
        type: string
      - name: wu_jen_list_marker
        label: Wu Jen list marker
        type: string
      - name: source
        label: Source
        type: select
        required: true
        options: *sources_all
      - *content_status
      - *incomplete_reason
      - *source_type
      - *incomplete
      - *appeared_in
      - *body

  # Magic items (SRD + Homebrew)
  - name: items
    label: Items
    type: collection
    path: content/items
    exclude:
      - index.md
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - rarity
        - item_type
        - source
      sort: title
    fields:
      - *entity_type
      - *canonical_id
      - *edition
      - *adaptation
      - *license_status
      - name: title
        label: Item name
        type: string
        required: true
      - name: rarity
        label: Rarity
        type: select
        options:
          values:
            - Common
            - Uncommon
            - Rare
            - Very Rare
            - Legendary
            - Artifact
            - Varies
      - name: item_type
        label: Item type
        type: string
      - name: attunement
        label: Requires attunement
        type: boolean
      - *summary
      - *image
      - name: source
        label: Source
        type: select
        required: true
        options: *sources_all
      - *content_status
      - *incomplete_reason
      - *source_type
      - *incomplete
      - *appeared_in
      - *body

  # Character options (Classes, Subclasses, Races, Backgrounds, Feats, Templates, Class Options)
  - name: character-options
    label: Character options
    type: group
    items:
      - name: co-classes
        label: Classes
        type: collection
        path: content/character-options/classes
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - hit_die
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - name: hit_die
            label: Hit die
            type: select
            options:
              values:
                - d6
                - d8
                - d10
                - d12
          - name: spellcasting_ability
            label: Spellcasting ability
            type: select
            options:
              values: [STR, DEX, CON, INT, WIS, CHA, choice]
          - name: saving_throws
            label: Saving throws
            type: select
            options:
              multiple: true
              values:
                - STR
                - DEX
                - CON
                - INT
                - WIS
                - CHA
          - *summary
          - *image
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-subclasses
        label: Subclasses
        type: collection
        path: content/character-options/subclasses
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - parent_class
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - name: parent_class
            label: Parent class
            type: select
            required: true
            options:
              values:
                - Artificer
                - Barbarian
                - Bard
                - Cleric
                - Druid
                - Fighter
                - Monk
                - Paladin
                - Paragon
                - Ranger
                - Rogue
                - Sorcerer
                - Warlock
                - Wizard
                - Tamer
                - Thanatomancer
          - *summary
          - *image
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-races
        label: Races
        type: collection
        path: content/character-options/races
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - *summary
          - *image
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-backgrounds
        label: Backgrounds
        type: collection
        path: content/character-options/backgrounds
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - *summary
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-templates
        label: Templates
        type: collection
        path: content/character-options/templates
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - *summary
          - *image
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-class-options
        label: Class options
        type: collection
        path: content/character-options/class-options
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - option_group
            - parent_class
            - min_level
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - name: option_group
            label: Group (like Eldritch Invocation)
            type: select
            required: true
            options:
              values:
                - Eldritch Invocation
                - Metamagic
                - Avatar Feature
                - Infusion
                - Maneuver
                - Other
                - Martial Exploit
                - Mystic Techniques
          - name: parent_class
            label: Class or subclass
            type: select
            required: true
            options:
              values:
                - Artificer
                - Barbarian
                - Bard
                - Cleric
                - Druid
                - Fighter
                - Monk
                - Paladin
                - Paragon
                - Ranger
                - Rogue
                - Sorcerer
                - Warlock
                - Wizard
                - Order of Valor
                - Order of the Voice
                - Order of Reason
                - Tamer
                - Thanatomancer
          - name: min_level
            label: Minimum level
            type: number
          - name: prerequisite
            label: Prerequisite (or None)
            type: string
          - name: aliases
            label: Legacy URL redirects
            type: string
            list: true
          - name: degree
            label: Degree
            type: number
          - *summary
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-fighting-styles
        label: Fighting Styles
        type: collection
        path: content/character-options/fighting-styles
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - parent_class
            - min_level
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - *legacy_aliases
          - name: option_group
            label: Option group
            type: string
          - name: parent_class
            label: Class or classes
            type: string
          - name: min_level
            label: Minimum level
            type: number
          - name: prerequisite
            label: Prerequisite
            type: string
          - *summary
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

      - name: co-feats
        label: Feats
        type: collection
        path: content/character-options/feats
        filename: "{primary}.md"
        view:
          primary: title
          fields:
            - prerequisite
            - source
          sort: title
        fields:
          - *entity_type
          - *canonical_id
          - *edition
          - *adaptation
          - *license_status
          - *title
          - name: prerequisite
            label: Prerequisite
            type: string
          - *summary
          - name: source
            label: Source
            type: select
            required: true
            options: *sources_all
          - *content_status
          - *incomplete_reason
          - *source_type
          - *incomplete
          - *body

  # Monsters (SRD + Homebrew + Corpus Angelus)
  - name: monsters
    label: Monsters
    type: collection
    path: content/monsters
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - size
        - creature_type
        - cr
        - source
      sort: title
    exclude:
      - index.md
    fields:
      - *entity_type
      - *canonical_id
      - *edition
      - *adaptation
      - *license_status
      - *title
      - name: size
        label: Size
        type: select
        options:
          values:
            - Tiny
            - Small
            - Medium
            - Large
            - Huge
            - Gargantuan
      - name: creature_type
        label: Creature type
        type: string
      - name: habitats
        label: Habitats
        type: string
        list: true
      - name: roles
        label: Roles
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: legendary
        label: Legendary
        type: boolean
      - name: lair
        label: Has a lair
        type: boolean
      - name: spellcaster
        label: Spellcaster
        type: boolean
      - name: alignment
        label: Alignment
        type: string
      - name: ac
        label: Armor class
        type: number
      - name: hp
        label: Hit points
        type: number
      - name: cr
        label: Challenge rating (like 1/4 or 3)
        type: string
      - *image
      - name: source
        label: Source
        type: select
        required: true
        options: *sources_all
      - *content_status
      - *incomplete_reason
      - *source_type
      - *incomplete
      - *appeared_in
      - name: body
        label: Stat block (Markdown)
        type: text
