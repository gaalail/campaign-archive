# Pages CMS config: defines the entry forms at app.pagescms.org
media:
  input: content/media
  output: /campaign-archive/media
content:
- name: ra-golvek
  label: Ra Gol'vek
  type: group
  items:
  - name: ra-golvek-entries
    label: Entries
    type: collection
    path: content/ra-golvek
    exclude:
    - index.md
    filename: '{primary}.md'
    view:
      primary: title
      fields:
      - type
      - summary
      sort: title
    fields:
    - name: title
      label: Name
      type: string
      required: true
    - name: type
      label: Type
      type: select
      options:
        values: &id002
        - Character
        - Place
        - Faction
        - Lore
        - Session
        - Item
        - Rules
        - Other
    - name: summary
      label: One-line summary
      type: string
    - name: tags
      label: Tags
      type: string
      list: true
    - name: image
      label: Picture (optional)
      type: image
    - &id001
      name: body
      label: Text (Markdown)
      type: text
  - name: ra-golvek-hub
    label: Hub page
    type: file
    path: content/ra-golvek/index.md
    fields:
    - name: title
      type: string
    - *id001
- name: vyrun
  label: Vyrun
  type: group
  items:
  - name: vyrun-entries
    label: Entries
    type: collection
    path: content/vyrun
    exclude:
    - index.md
    filename: '{primary}.md'
    view:
      primary: title
      fields:
      - type
      - summary
      sort: title
    fields:
    - name: title
      label: Name
      type: string
      required: true
    - name: type
      label: Type
      type: select
      options:
        values: *id002
    - name: summary
      label: One-line summary
      type: string
    - name: tags
      label: Tags
      type: string
      list: true
    - name: image
      label: Picture (optional)
      type: image
    - *id001
  - name: vyrun-hub
    label: Hub page
    type: file
    path: content/vyrun/index.md
    fields:
    - name: title
      type: string
    - *id001
- name: curse-of-strahd
  label: Curse of Strahd
  type: group
  items:
  - name: curse-of-strahd-entries
    label: Entries
    type: collection
    path: content/curse-of-strahd
    exclude:
    - index.md
    filename: '{primary}.md'
    view:
      primary: title
      fields:
      - type
      - summary
      sort: title
    fields:
    - name: title
      label: Name
      type: string
      required: true
    - name: type
      label: Type
      type: select
      options:
        values: *id002
    - name: summary
      label: One-line summary
      type: string
    - name: tags
      label: Tags
      type: string
      list: true
    - name: image
      label: Picture (optional)
      type: image
    - *id001
  - name: curse-of-strahd-hub
    label: Hub page
    type: file
    path: content/curse-of-strahd/index.md
    fields:
    - name: title
      type: string
    - *id001
- name: spells
  label: Spells
  type: collection
  path: content/spells
  exclude:
  - index.md
  filename: '{primary}.md'
  view:
    primary: title
    fields:
    - level
    - school
    - classes
    - source
    sort: title
  fields:
  - name: title
    label: Spell name
    type: string
    required: true
  - name: level
    label: Level (0 for cantrip)
    type: number
    required: true
  - name: school
    label: School
    type: select
    options:
      values:
      - Abjuration
      - Conjuration
      - Divination
      - Enchantment
      - Evocation
      - Illusion
      - Necromancy
      - Transmutation
  - name: classes
    label: Classes
    type: select
    options:
      multiple: true
      values:
      - Artificer
      - Barbarian
      - Bard
      - Cleric
      - Druid
      - Fighter
      - Monk
      - Paladin
      - Ranger
      - Rogue
      - Sorcerer
      - Warlock
      - Wizard
  - name: casting_time
    label: Casting time
    type: string
  - name: range
    label: Range
    type: string
  - name: duration
    label: Duration
    type: string
  - name: components
    label: Components (V, S, M)
    type: string
  - name: ritual
    label: Ritual
    type: boolean
  - name: concentration
    label: Concentration
    type: boolean
  - name: source
    label: Source
    type: select
    required: true
    options: &id003
      values:
      - SRD 5.1
      - Homebrew
  - name: body
    label: Description (Markdown)
    type: text
- name: items
  label: Items
  type: collection
  path: content/items
  exclude:
  - index.md
  filename: '{primary}.md'
  view:
    primary: title
    fields:
    - rarity
    - item_type
    - source
    sort: title
  fields:
  - name: title
    label: Item name
    type: string
    required: true
  - name: rarity
    label: Rarity
    type: select
    options:
      values:
      - Common
      - Uncommon
      - Rare
      - Very Rare
      - Legendary
      - Artifact
      - Varies
  - name: item_type
    label: Item type
    type: string
  - name: attunement
    label: Requires attunement
    type: boolean
  - name: summary
    label: One-line summary
    type: string
  - name: image
    label: Picture (optional)
    type: image
  - name: source
    label: Source
    type: select
    required: true
    options: *id003
  - *id001
- name: character-options
  label: Character options
  type: group
  items:
  - name: co-classes
    label: Classes
    type: collection
    path: content/character-options/classes
    filename: '{primary}.md'
    fields:
    - &id005
      name: title
      label: Name
      type: string
      required: true
    - name: hit_die
      label: Hit die
      type: select
      options:
        values:
        - d6
        - d8
        - d10
        - d12
    - name: spellcasting_ability
      label: Spellcasting ability
      type: select
      options:
        values: &id004
        - STR
        - DEX
        - CON
        - INT
        - WIS
        - CHA
    - name: saving_throws
      label: Saving throws
      type: select
      options:
        multiple: true
        values: *id004
    - &id006
      name: summary
      label: One-line summary
      type: string
    - name: image
      label: Picture (optional)
      type: image
    - name: source
      label: Source
      type: select
      required: true
      options: &id007
        values:
        - SRD 5.1
        - Homebrew
        - Corpus Angelus
    - &id008
      name: body
      label: Text (Markdown)
      type: text
    view:
      primary: title
      fields:
      - hit_die
      - source
      sort: title
  - name: co-subclasses
    label: Subclasses
    type: collection
    path: content/character-options/subclasses
    filename: '{primary}.md'
    fields:
    - *id005
    - name: parent_class
      label: Parent class
      type: select
      required: true
      options:
        values:
        - Artificer
        - Barbarian
        - Bard
        - Cleric
        - Druid
        - Fighter
        - Monk
        - Paladin
        - Paragon
        - Ranger
        - Rogue
        - Sorcerer
        - Warlock
        - Wizard
    - *id006
    - name: image
      label: Picture (optional)
      type: image
    - name: source
      label: Source
      type: select
      required: true
      options: *id007
    - *id008
    view:
      primary: title
      fields:
      - parent_class
      - source
      sort: title
  - name: co-races
    label: Races
    type: collection
    path: content/character-options/races
    filename: '{primary}.md'
    fields:
    - *id005
    - *id006
    - name: image
      label: Picture (optional)
      type: image
    - name: source
      label: Source
      type: select
      required: true
      options: *id007
    - *id008
    view:
      primary: title
      fields:
      - source
      sort: title
  - name: co-backgrounds
    label: Backgrounds
    type: collection
    path: content/character-options/backgrounds
    filename: '{primary}.md'
    fields:
    - *id005
    - *id006
    - name: source
      label: Source
      type: select
      required: true
      options: *id007
    - *id008
    view:
      primary: title
      fields:
      - source
      sort: title
  - name: co-class-options
    label: Class options
    type: collection
    path: content/character-options/class-options
    filename: '{primary}.md'
    fields:
    - *id005
    - name: option_group
      label: Group (like Eldritch Invocation)
      type: select
      required: true
      options:
        values:
        - Eldritch Invocation
        - Metamagic
        - Avatar Feature
        - Infusion
        - Maneuver
        - Other
    - name: parent_class
      label: Class or subclass
      type: select
      required: true
      options:
        values:
        - Artificer
        - Barbarian
        - Bard
        - Cleric
        - Druid
        - Fighter
        - Monk
        - Paladin
        - Paragon
        - Ranger
        - Rogue
        - Sorcerer
        - Warlock
        - Wizard
        - Order of Valor
        - Order of the Voice
        - Order of Reason
    - name: min_level
      label: Minimum level
      type: number
    - name: prerequisite
      label: Prerequisite (or None)
      type: string
    - *id006
    - name: source
      label: Source
      type: select
      required: true
      options: *id007
    - *id008
    view:
      primary: title
      fields:
      - option_group
      - parent_class
      - min_level
      - source
      sort: title
  - name: co-feats
    label: Feats
    type: collection
    path: content/character-options/feats
    filename: '{primary}.md'
    fields:
    - *id005
    - name: prerequisite
      label: Prerequisite
      type: string
    - *id006
    - name: source
      label: Source
      type: select
      required: true
      options: *id007
    - *id008
    view:
      primary: title
      fields:
      - prerequisite
      - source
      sort: title
- name: rules
  label: Rules
  type: collection
  path: content/rules
  exclude:
  - index.md
  filename: '{primary}.md'
  fields:
  - name: title
    type: string
    required: true
  - name: summary
    type: string
  - *id001
- name: monsters
  label: Monsters
  type: collection
  path: content/monsters
  filename: '{primary}.md'
  fields:
  - *id005
  - name: size
    label: Size
    type: select
    options:
      values:
      - Tiny
      - Small
      - Medium
      - Large
      - Huge
      - Gargantuan
  - name: creature_type
    label: Creature type
    type: string
  - name: alignment
    label: Alignment
    type: string
  - name: ac
    label: Armor class
    type: number
  - name: hp
    label: Hit points
    type: number
  - name: cr
    label: Challenge rating (like 1/4 or 3)
    type: string
  - name: image
    label: Picture (optional)
    type: image
  - name: source
    label: Source
    type: select
    required: true
    options: *id007
  - name: body
    label: Stat block (Markdown)
    type: text
  view:
    primary: title
    fields:
    - size
    - creature_type
    - cr
    - source
    sort: title
  exclude:
  - index.md
