name: Archive quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check code, Markdown, and archive links
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Quartz from a clean checkout
        run: node ./quartz/bootstrap-cli.mjs build
      - name: Verify generated site links and sitemap
        run: npm run verify:site
      - name: Verify folder and alias navigation in Chromium
        run: npm run verify:browser
